<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小論文構築（論理変換）</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Serif JP", "Yu Mincho", serif;
    background: #0a0e18;
    color: #d8e0ee;
    min-height: 100vh;
  }

  .deco {
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, #0a2050 0%, transparent 70%);
    top: -100px; right: -150px;
    pointer-events: none;
    opacity: 0.5;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 64px 32px 80px;
  }

  /* ── HEADER ── */
  .header {
    margin-bottom: 48px;
    padding-bottom: 28px;
    border-bottom: 1px solid #1e2a44;
  }

  .breadcrumb {
    font-family: "Cormorant Garamond", serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #4a6a9a;
    margin-bottom: 12px;
  }

  .breadcrumb a {
    color: #e8b84a;
    text-decoration: none;
  }

  .breadcrumb a:hover { text-decoration: underline; }

  .page-label {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 10px;
  }

  .roman {
    font-family: "Cormorant Garamond", serif;
    font-size: 36px;
    font-weight: 400;
    color: #b88820;
    line-height: 1;
  }

  h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #e8f0ff;
    line-height: 1.2;
  }

  .page-note {
    font-size: 13px;
    color: #5a6a88;
    line-height: 1.9;
    font-weight: 300;
    margin-top: 10px;
  }

  /* ── FLOW INDICATOR ── */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 2px;
  }

  .flow-step {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #3a5070;
    padding: 5px 10px;
    border: 1px solid #182030;
    background: #0c1220;
  }

  .flow-arrow {
    font-size: 11px;
    color: #e8b84a;
    padding: 0 2px;
  }

  /* ── BLOCKS ── */
  .blocks {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .block {
    border: 1px solid #182030;
    border-left: 3px solid #d4a017;
    background: #0c1220;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
  }

  .block:hover {
    border-color: #2a4878;
    border-left-color: #e8b84a;
    background: #0e1628;
  }

  .block-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid #182030;
  }

  .block-num {
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    font-weight: 400;
    color: #e8b84a;
    line-height: 1;
    min-width: 22px;
  }

  h3 {
    font-family: "Cormorant Garamond", serif;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #a8c4e8;
  }

  .block-body {
    padding: 16px 24px 20px;
  }

  textarea {
    width: 100%;
    height: 90px;
    background: #08100e;
    border: 1px solid #1e2a44;
    color: #c8d8ee;
    font-family: "Noto Serif JP", serif;
    font-size: 13px;
    line-height: 1.9;
    padding: 10px 14px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: #2a4878; }
  textarea::placeholder { color: #2a3850; font-size: 12px; }

  /* ── BUTTON ── */
  .btn-wrap {
    margin-top: 32px;
    display: flex;
    justify-content: flex-end;
  }

  button {
    padding: 11px 28px;
    background: transparent;
    border: 1px solid #d4a017;
    color: #e8b84a;
    font-family: "Noto Serif JP", serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background: #1a1408;
    border-color: #e8b84a;
    color: #f8d870;
  }

  @media (max-width: 560px) {
    h1 { font-size: 22px; }
    .roman { font-size: 28px; }
    .wrap { padding: 40px 20px 60px; }
    .flow { gap: 4px; }
  }
</style>
</head>
<body>
<div class="deco"></div>
<div class="wrap">

  <header class="header">
    <div class="breadcrumb">
      <a href="index.html">世の中の疑問ブログ</a> / Ⅱ. 論理変換
    </div>
    <div class="page-label">
      <span class="roman">Ⅱ</span>
      <h1>小論文構築（論理変換）</h1>
    </div>
    <p class="page-note">観察された事象を、以下の5構造に分解・再構成する。</p>
  </header>

  <div class="flow">
    <span class="flow-step">問題提起</span>
    <span class="flow-arrow">→</span>
    <span class="flow-step">概念定義</span>
    <span class="flow-arrow">→</span>
    <span class="flow-step">分析</span>
    <span class="flow-arrow">→</span>
    <span class="flow-step">反論想定</span>
    <span class="flow-arrow">→</span>
    <span class="flow-step">結論</span>
  </div>

  <div class="blocks">

    <div class="block">
      <div class="block-header">
        <span class="block-num">①</span>
        <h3>問題提起</h3>
      </div>
      <div class="block-body">
        <textarea placeholder="何が問題なのかを一文で設定する…"></textarea>
      </div>
    </div>

    <div class="block">
      <div class="block-header">
        <span class="block-num">②</span>
        <h3>概念定義</h3>
      </div>
      <div class="block-body">
        <textarea placeholder="論の中心となる概念を明確に定義する…"></textarea>
      </div>
    </div>

    <div class="block">
      <div class="block-header">
        <span class="block-num">③</span>
        <h3>分析（原因・構造）</h3>
      </div>
      <div class="block-body">
        <textarea placeholder="問題の原因や構造を論理的に分解する…"></textarea>
      </div>
    </div>

    <div class="block">
      <div class="block-header">
        <span class="block-num">④</span>
        <h3>反論想定</h3>
      </div>
      <div class="block-body">
        <textarea placeholder="予想される反対意見を先に構造化し、再配置する…"></textarea>
      </div>
    </div>

    <div class="block">
      <div class="block-header">
        <span class="block-num">⑤</span>
        <h3>結論</h3>
      </div>
      <div class="block-body">
        <textarea placeholder="分析と反論処理を経た上での主張を述べる…"></textarea>
      </div>
    </div>

  </div>

  <div class="btn-wrap">
    <button>小論文を完成させる →</button>
  </div>

</div>
</body>
</html>
